services:
  node0:
    build: .
    container_name: node0
    hostname: node0
    networks:
      test-net:
        ipv4_address: 10.0.0.5
    command: ["./user", "8008"]

  node1:
    build: .
    container_name: node1
    hostname: node1
    networks:
      test-net:
        ipv4_address: 10.0.0.6
    depends_on:
      - node0
    command: ["sh", "-c", "sleep 2 && ./user 8008 10.0.0.5 8008"]

  node2:
    build: .
    container_name: node2
    hostname: node2
    networks:
      test-net:
        ipv4_address: 10.0.0.7
    depends_on:
      - node0
      - node1
    command: ["sh", "-c", "sleep 2 && ./user 8008 10.0.0.5 8008 10.0.0.6 8008"]

  node3:
    build: .
    container_name: node3
    hostname: node3
    networks:
      test-net:
        ipv4_address: 10.0.0.8
    depends_on:
      - node2
      - node0
      - node1
    command: ["sh", "-c", "sleep 2 && ./user 8008 10.0.0.7 8008 10.0.0.5 8008 10.0.0.6 8008"]

  node4:
    build: .
    container_name: node4
    hostname: node4
    networks:
      test-net:
        ipv4_address: 10.0.0.9
    depends_on:
      - node2
      - node3
      - node0
    command: ["sh", "-c", "sleep 3 && ./user 8008 10.0.0.7 8008 10.0.0.8 8008 10.0.0.5 8008"]

  node5:
    build: .
    container_name: node5
    hostname: node5
    networks:
      test-net:
        ipv4_address: 10.0.0.10
    depends_on:
      - node1
      - node3
      - node4
    command: ["sh", "-c", "sleep 3 && ./user 8008 10.0.0.6 8008 10.0.0.8 8008 10.0.0.9 8008"]

networks:
  test-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
